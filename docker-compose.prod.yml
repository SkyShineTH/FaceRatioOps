services:
  api:
    build: !reset null
    image: ${FACERATIOOPS_IMAGE:-ghcr.io/skyshineth/faceratioops:main}
    ports: !override
      - "127.0.0.1:8000:8000"
    env_file: !override
      - path: .env.production.example
        required: true
      - path: .env.production
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Alertmanager routing for FaceRatioOps.
#
# The default receiver is a no-op so the monitoring stack runs out of the box with no
# secrets committed. To actually notify, set a webhook (Slack/Discord/email) via an
# environment-substituted receiver or edit this file on the host. Keep any real webhook
# URL out of git.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "slo"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Page-level alerts could route to a faster channel; keep grouped here by default.
    - matchers:
        - severity = page
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    # No notifier configured. Add a webhook_configs / slack_configs block here, e.g.:
    # slack_configs:
    #   - api_url: ${SLACK_WEBHOOK_URL}
    #     channel: "#faceratioops-alerts"
    #     send_resolved: true

inhibit_rules:
  # A down target makes its budget-burn alerts redundant; suppress the noise.
  - source_matchers:
      - alertname = FaceRatioOpsTargetDown
    target_matchers:
      - slo = availability
    equal: ["job"]

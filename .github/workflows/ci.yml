name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA into app/static_dist (required by frontend tests)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test
        run: pytest

      - name: Build Docker image
        run: docker build -t faceratioops:ci .

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: faceratioops:ci
          format: spdx-json
          output-file: faceratioops-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: faceratioops-sbom
          path: faceratioops-sbom.spdx.json

      - name: Scan image for vulnerabilities (Trivy, SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: faceratioops:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Gate on CRITICAL only. HIGH and below are still reported to code scanning
      # (SARIF step above) for triage, but are not blocking: some fixable HIGHs come
      # from transitive/build packages or are pinned by upstream (e.g. protobuf is
      # constrained to <5 by MediaPipe 0.10.21), so a HIGH gate would be permanently red.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: faceratioops:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  config-validate:
    name: Validate monitoring rules and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Prometheus rules (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD:/work" -w /work \
            prom/prometheus:v2.55.1 \
            check rules deploy/prometheus/rules/recording.yml deploy/prometheus/rules/alerts.yml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

name: Publish Container Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Check main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production image publishing is restricted to main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${GITHUB_REPOSITORY,,}"
          IMAGE="$REGISTRY/$IMAGE_REPOSITORY"
          SHORT_SHA="${GITHUB_SHA::12}"

          for attempt in 1 2 3; do
            if docker buildx build \
              --push \
              --provenance=false \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.description=Privacy-first FastAPI inference API for facial geometry analysis" \
              -t "$IMAGE:main" \
              -t "$IMAGE:$SHORT_SHA" \
              -t "$IMAGE:$GITHUB_SHA" \
              .; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Image push failed after 3 attempts."
              exit 1
            fi

            sleep $((attempt * 20))
          done

          echo "Published $IMAGE:main"
          echo "Published $IMAGE:$SHORT_SHA"
